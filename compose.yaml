services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: ssc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${SSC_POSTGRES_PORT:?Run npm run db:up}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s
    shm_size: 128mb

secrets:
  postgres_password:
    file: ${SSC_POSTGRES_PASSWORD_FILE:?Run npm run db:up}

volumes:
  postgres-data:
