name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Generate local documentation index
        run: npm run docs:index

      - name: Check published documentation
        run: npm run docs:check

      - name: Build application
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare PostgreSQL image
        run: |
          docker info --format '{{.OSType}}'
          docker compose version
          docker pull postgres:18.6-bookworm

      - name: Test transactions and database recovery
        run: npm run test:docker

      - name: Test application in Chromium
        run: npm run test:browser:docker

      - name: Upload test reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-results-${{ github.run_attempt }}
          path: |
            test-results/*.xml
            test-results/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
